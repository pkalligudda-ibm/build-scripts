        run: |
          if find "$GITHUB_WORKSPACE/v2-scan-workspace/wheels" -maxdepth 1 -name '*.whl' -print -quit | grep -q .; then
            chmod +x ./gha-script/v2-script/scan_wheel.sh
            GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype" \
              bash ./gha-script/v2-script/scan_wheel.sh "$GITHUB_WORKSPACE/v2-scan-workspace" "$GITHUB_WORKSPACE"
          else
            echo "No wheel was preserved by PowerCore; wheel scans skipped."
          fi

      - name: Remove scanner installation files
        run: |
          rm -rf "$GITHUB_WORKSPACE/v2-scan-workspace/scancode-toolkit"
          rm -f "$GITHUB_WORKSPACE/v2-scan-workspace/package-cache"/*.tar.gz
          rm -f "$GITHUB_WORKSPACE/v2-scan-workspace/package-cache"/*checksums.txt

      - name: Archive and upload V2 scan results to COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          ARTIFACT_NAME="${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-scan-result-${PYTHON_VERSION}"
          tar -czf "${ARTIFACT_NAME}.tar.gz" v2-scan-workspace
          chmod +x ./gha-script/v2-script/upload_to_cos.sh
          bash ./gha-script/v2-script/upload_to_cos.sh "${ARTIFACT_NAME}.tar.gz"

      - name: Cleanup — teardown PowerCore and remove downloaded files
        if: always()
        run: |
          chmod +x ./gha-script/v2-script/cleanup-powercore.sh
          bash ./gha-script/v2-script/cleanup-powercore.sh

  v2_license_extraction:
    needs: [wheel_build_py312, wheel_build_py313, wheel_build_py314]
    if: |
      always() &&
      (needs.wheel_build_py312.result == 'success' ||
       needs.wheel_build_py313.result == 'success' ||
       needs.wheel_build_py314.result == 'success')
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect scan results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          chmod +x ./gha-script/v2-script/collect_scan_results.sh
          bash ./gha-script/v2-script/collect_scan_results.sh \
            "${{ fromJson(inputs.package_json).package_name }}" \
            "${{ fromJson(inputs.package_json).package_version }}" \
            "$GITHUB_WORKSPACE/v2-scan-workspace"

      - name: Extract wheel licenses
        run: |
          chmod +x ./gha-script/v2-script/extract_wheel_licenses.sh
          bash ./gha-script/v2-script/extract_wheel_licenses.sh \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "$GITHUB_WORKSPACE"

      - name: Archive and upload license results to COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          ARTIFACT_NAME="${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results"
          tar -czf "${ARTIFACT_NAME}.tar.gz" v2-scan-workspace/wheel
          chmod +x ./gha-script/v2-script/upload_to_cos.sh
          bash ./gha-script/v2-script/upload_to_cos.sh "${ARTIFACT_NAME}.tar.gz"

  v2_final_summary:
    needs: [v2_license_extraction]
    if: ${{ needs.v2_license_extraction.result == 'success' }}
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect scan results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          chmod +x ./gha-script/v2-script/collect_scan_results.sh
          bash ./gha-script/v2-script/collect_scan_results.sh \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" \
            "$GITHUB_WORKSPACE/v2-scan-workspace"

      - name: Download and extract license results from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          chmod +x ./gha-script/v2-script/download_from_cos.sh
          bash ./gha-script/v2-script/download_from_cos.sh \
            "${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results.tar.gz"
          tar -xzf "${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-license-results.tar.gz"

      - name: Create and print final V2 scan summary
        env:
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          python3 ./gha-script/v2-script/create_scan_summary.py \
            "$GITHUB_WORKSPACE/v2-scan-workspace" \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archive and upload final V2 summary to COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
          PACKAGE_NAME: ${{ fromJson(inputs.package_json).package_name }}
          PACKAGE_VERSION: ${{ fromJson(inputs.package_json).package_version }}
        run: |
          ARTIFACT_NAME="${PACKAGE_NAME}-${PACKAGE_VERSION}-v2-final-summary"
          tar -czf "${ARTIFACT_NAME}.tar.gz" v2-scan-workspace/final_summary.json
          chmod +x ./gha-script/v2-script/upload_to_cos.sh
          bash ./gha-script/v2-script/upload_to_cos.sh "${ARTIFACT_NAME}.tar.gz"
