name: Currency Build V2 Test
on:
  workflow_dispatch:
    inputs:
      package_json:
        description: >
          Package data as a JSON object. Example:
          {"package_name":"brotlipy","package_version":"v0.8.0","technology":"python","technology_version":"3.12","ubi_version":""}
        required: true
        type: string
      validate_build_script_v2:
        description: 'Run v2 build script via powercore'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      wheel_build:
        description: 'Create wheel for all Python versions via powercore'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      build_docker:
        description: 'Build docker image'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      powercore_version:
        description: 'Version of powercore wheels to download from COS (e.g. 1.2.3)'
        required: true
        type: string
      large-runner-label:
        description: 'Larger runner to use for resource-heavy builds'
        required: false
        type: choice
        options:
          - ''
          - ubuntu-24.04-ppc64le-2xlarge-p10
          - ubuntu-24.04-ppc64le-4xlarge-p10

run-name: >
  ${{ inputs.large-runner-label != '' &&
      format('Retriggered Currency Build V2 for {0} on {1}', fromJson(inputs.package_json).package_name, inputs.large-runner-label) ||
      format('Currency Build V2 — {0} {1}', fromJson(inputs.package_json).package_name, fromJson(inputs.package_json).package_version)
  }}

jobs:
  # ---------------------------------------------------------------------------
  # build_info: Parses the package_json input, validates required fields, and
  # writes variable.sh — a sourceable shell file uploaded as an artifact so
  # every downstream job can download it and source it directly.
  #
  # Variables written to variable.sh:
  #   PACKAGE_NAME             — from package_json.package_name
  #   PACKAGE_VERSION          — from package_json.package_version
  #   TECHNOLOGY               — from package_json.technology
  #   TECHNOLOGY_VERSION       — from package_json.technology_version
  #   UBI_VERSION              — from package_json.ubi_version (default: ubi9)
  #   VALIDATE_BUILD_SCRIPT_V2 — from workflow input
  #   WHEEL_BUILD              — from workflow input
  #   BUILD_DOCKER             — from workflow input
  #   POWERCORE_VERSION        — from workflow input
  # ---------------------------------------------------------------------------
  build_info:
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Install jq
        run: sudo apt update -y && sudo apt install -y jq

      - name: Parse package_json and write variable.sh
        run: |
          PKG_JSON='${{ inputs.package_json }}'

          # Validate JSON
          if ! echo "$PKG_JSON" | jq empty 2>/dev/null; then
            echo "❌ package_json is not valid JSON"
            exit 1
          fi

          # Extract fields — technology_version key may have a leading space in
          # some callers (e.g. {" technology_version": "3.12"}), handle both forms
          PKG_NAME=$(echo "$PKG_JSON" | jq -r '.package_name    // empty')
          PKG_VER=$(echo  "$PKG_JSON" | jq -r '.package_version // empty')
          TECH=$(echo     "$PKG_JSON" | jq -r '.technology      // empty')
          TECH_VER=$(echo "$PKG_JSON" | jq -r '.technology_version // (.["  technology_version"] // "")' 2>/dev/null || echo "")
          UBI_VER=$(echo  "$PKG_JSON" | jq -r '.ubi_version // ""')

          # Validate required fields
          for field in PKG_NAME PKG_VER TECH; do
            eval "val=\$$field"
            if [ -z "$val" ]; then
              echo "❌ Required field missing in package_json: $field"
              exit 1
            fi
          done

          # Default ubi_version to ubi9 when blank
          UBI_VER="${UBI_VER:-ubi9}"

          # Write variable.sh as plain KEY="VALUE" lines — no 'export' prefix so
          # the file can be sourced in bash (source variable.sh) or loaded by any
          # downstream step that reads it line by line into $GITHUB_ENV.
          # Using printf avoids heredoc indentation issues in YAML run blocks.
          printf '%s\n' \
            "PACKAGE_NAME=\"${PKG_NAME}\"" \
            "PACKAGE_VERSION=\"${PKG_VER}\"" \
            "TECHNOLOGY=\"${TECH}\"" \
            "TECHNOLOGY_VERSION=\"${TECH_VER}\"" \
            "UBI_VERSION=\"${UBI_VER}\"" \
            "VALIDATE_BUILD_SCRIPT_V2=\"${{ inputs.validate_build_script_v2 }}\"" \
            "WHEEL_BUILD=\"${{ inputs.wheel_build }}\"" \
            "BUILD_DOCKER=\"${{ inputs.build_docker }}\"" \
            "POWERCORE_VERSION=\"${{ inputs.powercore_version }}\"" \
            > variable.sh

          echo "===== variable.sh ====="
          cat variable.sh
          echo "======================="
          echo "✅ ${PKG_NAME} ${PKG_VER} (${TECH} ${TECH_VER:-default}) ubi=${UBI_VER}"

      - name: Upload variable.sh as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: variable.sh

  # ---------------------------------------------------------------------------
  # build_v2: Downloads build-info artifact, sources variable.sh to get all
  # build parameters, then downloads PowerCore wheels from COS, installs
  # PowerCore, converts the parameters to a CSV, drops it into the preprocess
  # inbox, and polls until the pipeline completes or fails.
  # ---------------------------------------------------------------------------
  build_v2:
    needs: build_info
    if: ${{ inputs.validate_build_script_v2 == 'true' || inputs.wheel_build == 'true' || inputs.build_docker == 'true' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build-info artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info

      - name: Load variable.sh into job environment
        run: |
          echo "===== variable.sh ====="
          cat variable.sh
          echo "======================="
          # Push every KEY="VALUE" line from variable.sh into $GITHUB_ENV so
          # all subsequent steps in this job can reference ${{ env.KEY }}
          while IFS='=' read -r key value; do
            key="${key// /}"                                # strip any spaces from key
            [[ -z "$key" || "$key" == \#* ]] && continue  # skip blanks/comments
            value="${value%\"}"                             # strip trailing quote
            value="${value#\"}"                             # strip leading quote
            echo "${key}=${value}" >> $GITHUB_ENV
          done < variable.sh

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y wget curl tar jq git

      - name: Install powercore wheels from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          echo "Fetching IAM token..."
          token_request=$(curl -sS -X POST https://iam.cloud.ibm.com/identity/token \
            -H "content-type: application/x-www-form-urlencoded" \
            -H "accept: application/json" \
            -d "grant_type=urn%3Aibm%3Aparams%3Aoauth%3Agrant-type%3Aapikey&apikey=$GHA_CURRENCY_SERVICE_ID_API_KEY")

          if [[ $(echo "$token_request" | jq -r '.errorCode') != "null" ]]; then
            echo "ERROR: IAM token request failed. Response: $token_request"
            exit 1
          fi

          token=$(echo "$token_request" | jq -r '.access_token')
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "ERROR: IAM token missing from response: $token_request"
            exit 1
          fi

          BUCKET_URL="https://s3.us.cloud-object-storage.appdomain.cloud/powercore-wheels-staging"
          LIST_URL="${BUCKET_URL}?list-type=2&prefix=powercore"

          mkdir -p powercore-wheels

          # POWERCORE_VERSION is loaded from variable.sh via $GITHUB_ENV
          echo "Targeting powercore wheels version: ${POWERCORE_VERSION}"
          echo "Listing COS objects from: ${LIST_URL}"

          list_response=$(curl -sS -H "Authorization: bearer $token" "${LIST_URL}")
          curl_status=$?
          if [[ $curl_status -ne 0 ]]; then
            echo "ERROR: Failed to list wheels from COS. curl exit code: ${curl_status}"
            exit 1
          fi

          if echo "$list_response" | grep -q "<Error>"; then
            echo "ERROR: COS list request returned an error response:"
            echo "$list_response"
            exit 1
          fi

          all_keys=$(printf '%s' "$list_response" | tr '<' '\n' | sed -n 's:^Key>\([^<]*\.whl\)$:\1:p')

          if [[ -z "$all_keys" ]]; then
            echo "ERROR: No wheel files were found in COS list response."
            echo "COS list response:"
            echo "$list_response"
            exit 1
          fi

          echo "Available wheel keys:"
          echo "$all_keys"

          matched_keys=$(echo "$all_keys" | grep -F -- "-${POWERCORE_VERSION}-" || true)

          if [[ -z "$matched_keys" ]]; then
            echo "ERROR: No wheels found in COS matching version '${POWERCORE_VERSION}'"
            echo "Available wheels:"
            echo "$all_keys"
            exit 1
          fi

          echo "Matched wheels for version ${POWERCORE_VERSION}:"
          echo "$matched_keys"

          while IFS= read -r wheel_key; do
            [[ -z "$wheel_key" ]] && continue
            echo "Downloading: ${wheel_key}"
            if ! curl -fsS -H "Authorization: bearer $token" \
              -o "powercore-wheels/$(basename "$wheel_key")" \
              "${BUCKET_URL}/${wheel_key}"; then
              echo "ERROR: Failed to download wheel '${wheel_key}'"
              exit 1
            fi
          done <<< "$matched_keys"

          echo "Downloaded wheels:"
          ls -lh powercore-wheels/
          echo "Downloading powercore-config.env..."
          if ! curl -fsS -H "Authorization: bearer $token" \
            -o "powercore-config.env" \
            "${BUCKET_URL}/powercore-config.env"; then
            echo "ERROR: Failed to download powercore-config.env"
            exit 1
          fi
          echo "powercore-config.env contents:"
          cat powercore-config.env

      - name: Install powercore wheels
        run: |
          python3.12 -m pip install --upgrade pip --user --quiet

          # Step 1: install the powercore_installer wheel as root so that the
          # powercore-install console script lands in /usr/local/bin and can be
          # called with sudo in the next step.
          installer_wheel=$(ls powercore-wheels/powercore_installer-*.whl 2>/dev/null | head -1)
          if [[ -z "$installer_wheel" ]]; then
            echo "ERROR: powercore_installer wheel not found in powercore-wheels/"
            exit 1
          fi
          echo "Installing powercore_installer from: ${installer_wheel}"
          sudo python3.12 -m pip install "$installer_wheel" --force-reinstall

          echo "Installed packages:"
          python3.12 -m pip list | grep -i powercore

      - name: Install IBM Cloud CLI
        run: |
          echo "--- Installing IBM Cloud CLI ---"
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sudo sh

          echo "--- Verifying ibmcloud CLI ---"
          ibmcloud version

          echo "--- Installing cloud-object-storage plugin ---"
          ibmcloud plugin install cloud-object-storage -f
          echo "--- Installing container-registry plugin ---"
          ibmcloud plugin install container-registry -f

          echo "--- Installed ibmcloud plugins ---"
          ibmcloud plugin list

      - name: Run powercore-install
        run: |
          echo "--- powercore-config.env contents ---"
          cat "$(pwd)/powercore-config.env"

          echo "--- Running powercore-install ---"
          sudo powercore-install \
            --config "$(pwd)/powercore-config.env" \
            --non-interactive

          echo "--- Verifying powercore system user was created ---"
          if ! id powercore &>/dev/null; then
            echo "ERROR: 'powercore' system user was not created by powercore-install"
            exit 1
          fi
          echo "powercore user: $(id powercore)"

          echo "--- Checking powercore HOME directory ---"
          PC_HOME=$(getent passwd powercore | cut -d: -f6)
          echo "powercore HOME: ${PC_HOME}"
          ls -la "${PC_HOME}" || echo "WARN: could not list powercore HOME"

          echo "--- Installed powercore packages (root pip) ---"
          sudo python3.12 -m pip list 2>/dev/null | grep -i powercore || echo "WARN: no powercore packages found under root pip"

          echo "--- Installed powercore packages (powercore user pip) ---"
          sudo -u powercore python3.12 -m pip list 2>/dev/null | grep -i powercore || echo "WARN: no powercore packages found under powercore user pip"

          echo "--- Locating powercore-worker binary ---"
          for bin_path in /usr/local/bin/powercore-worker /usr/bin/powercore-worker \
                          "$(getent passwd powercore | cut -d: -f6)/.local/bin/powercore-worker"; do
            if [ -x "$bin_path" ]; then
              echo "Found: ${bin_path}"
            else
              echo "Not found: ${bin_path}"
            fi
          done

          echo "--- Installed systemd unit files ---"
          PC_HOME=$(getent passwd powercore | cut -d: -f6)
          find "${PC_HOME}/.config/systemd/user/" -name "*.service" -o -name "*.target" 2>/dev/null \
            | sort || echo "WARN: no unit files found under powercore user systemd directory"

      - name: Create PowerCore queue directories
        run: |
          # POWERCORE_RUNTIME is determined by POWERCORE_WORKSPACE in powercore-config.env.
          # The install chain is:
          #   powercore-install → automated-powercore-setup.sh:1075
          #     POWERCORE_RUNTIME="${POWERCORE_WORKSPACE}/runtime"
          #     (your config: POWERCORE_WORKSPACE=/home/powercore/powercore)
          #     → /home/powercore/powercore/runtime
          #   setup.sh:1182 writes this into systemd.env (read by all workers at startup)
          #   setup.sh:1080 calls deploy-workflow.sh which creates the queue dirs there
          #
          # We read the path from systemd.env — the single source of truth written by
          # the installer — instead of hardcoding it. Then we verify/fill any missing
          # dirs and export the resolved path to $GITHUB_ENV for every downstream step.

          if ! id powercore &>/dev/null; then
            echo "ERROR: 'powercore' user does not exist — cannot create queue directories"
            exit 1
          fi

          PC_HOME=$(getent passwd powercore | cut -d: -f6)

          # ── Resolve POWERCORE_RUNTIME from systemd.env ──────────────────────
          # The installer writes systemd.env to:
          #   ${POWERCORE_WORKSPACE}/runtime/config/systemd.env
          # With your config (POWERCORE_WORKSPACE=/home/powercore/powercore):
          #   /home/powercore/powercore/runtime/config/systemd.env
          SYSTEMD_ENV=$(sudo -u powercore find "${PC_HOME}" \
            -maxdepth 5 -name "systemd.env" -path "*/runtime/config/systemd.env" \
            2>/dev/null | head -1)

          if [ -n "$SYSTEMD_ENV" ]; then
            echo "--- Found systemd.env: ${SYSTEMD_ENV} ---"
            sudo -u powercore cat "${SYSTEMD_ENV}"
            POWERCORE_RUNTIME=$(sudo -u powercore grep -m1 '^POWERCORE_RUNTIME=' "${SYSTEMD_ENV}" \
              | cut -d= -f2- | tr -d ' "')
            echo "--- POWERCORE_RUNTIME from systemd.env: ${POWERCORE_RUNTIME} ---"
          else
            echo "WARN: systemd.env not found under ${PC_HOME} — installer may not have completed"
            echo "      Expected path: ${PC_HOME}/powercore/runtime/config/systemd.env"
          fi

          # Fallback: derive from POWERCORE_WORKSPACE default (matches your config)
          if [ -z "$POWERCORE_RUNTIME" ]; then
            POWERCORE_RUNTIME="${PC_HOME}/powercore/runtime"
            echo "WARN: falling back to default path: ${POWERCORE_RUNTIME}"
          fi

          echo "--- Using POWERCORE_RUNTIME: ${POWERCORE_RUNTIME} ---"

          # ── Export for all downstream steps in this job ──────────────────────
          echo "POWERCORE_RUNTIME=${POWERCORE_RUNTIME}" >> "$GITHUB_ENV"

          # ── Verify and fill any missing queue dirs ───────────────────────────
          # deploy-workflow.sh creates: inbox/outbox/processing/failed per stage.
          # worker.py also auto-creates inbox/outbox/processing on startup (L112-114),
          # but NOT failed/ or requests/. Ensure all exist.
          echo "--- Checking queue directories ---"
          CREATED=0; EXISTING=0

          _ensure_dir() {
            if sudo -u powercore test -d "$1" 2>/dev/null; then
              echo "  EXISTS : ${1#${POWERCORE_RUNTIME}/}"
              EXISTING=$(( EXISTING + 1 ))
            else
              sudo -u powercore mkdir -p "$1"
              echo "  CREATED: ${1#${POWERCORE_RUNTIME}/}"
              CREATED=$(( CREATED + 1 ))
            fi
          }

          for stage in 03-preprocess 04-shallow-scan 05-deep-scan 06-post-process 07-bookkeeping; do
            for sub in inbox outbox processing failed; do
              _ensure_dir "${POWERCORE_RUNTIME}/queues/${stage}/${sub}"
            done
          done
          for dir in requests incoming input logs; do
            _ensure_dir "${POWERCORE_RUNTIME}/${dir}"
          done

          echo ""
          echo "  Summary: ${CREATED} created, ${EXISTING} already existed"

          echo "--- Final queue directory tree ---"
          sudo -u powercore find "${POWERCORE_RUNTIME}/queues" -type d | sort

          echo "--- Full runtime tree (maxdepth 3) ---"
          sudo -u powercore find "${POWERCORE_RUNTIME}" -maxdepth 3 -type d | sort

      - name: Switch to powercore user and verify systemd target
        run: |
          if ! id powercore &>/dev/null; then
            echo "ERROR: 'powercore' user does not exist"
            exit 1
          fi

          POWERCORE_UID=$(id -u powercore)
          XDG_DIR="/run/user/${POWERCORE_UID}"
          DBUS="unix:path=/run/user/${POWERCORE_UID}/bus"

          echo "--- powercore UID: ${POWERCORE_UID} ---"
          echo "--- XDG_RUNTIME_DIR: ${XDG_DIR} ---"

          echo "--- Checking XDG_RUNTIME_DIR exists (loginctl may need to create it) ---"
          if [ ! -d "${XDG_DIR}" ]; then
            echo "WARN: ${XDG_DIR} does not exist — attempting loginctl linger enable"
            sudo loginctl enable-linger powercore || true
            sleep 3
          fi
          ls -la "${XDG_DIR}" 2>/dev/null || echo "WARN: ${XDG_DIR} still not available"

          echo "--- Reloading systemd user daemon ---"
          sudo -u powercore \
            XDG_RUNTIME_DIR="${XDG_DIR}" \
            DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
            systemctl --user daemon-reload

          echo "--- Starting powercore-workflow.target ---"
          sudo -u powercore \
            XDG_RUNTIME_DIR="${XDG_DIR}" \
            DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
            systemctl --user start powercore-workflow.target || true

          echo "--- Waiting 30 s for workers to initialise ---"
          sleep 30

          echo "--- powercore-workflow.target status ---"
          sudo -u powercore \
            XDG_RUNTIME_DIR="${XDG_DIR}" \
            DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
            systemctl --user status powercore-workflow.target --no-pager || true

          echo "--- Per-worker unit status ---"
          ALL_ACTIVE=true
          for stage in 03-preprocess 04-shallow-scan 05-deep-scan 06-post-process 07-bookkeeping; do
            STATUS=$(sudo -u powercore \
              XDG_RUNTIME_DIR="${XDG_DIR}" \
              DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
              systemctl --user is-active "powercore-worker@${stage}.service" 2>/dev/null || true)
            echo "  powercore-worker@${stage}: ${STATUS}"
            if [ "$STATUS" != "active" ]; then
              echo "  --- Journal for powercore-worker@${stage} ---"
              sudo -u powercore \
                XDG_RUNTIME_DIR="${XDG_DIR}" \
                DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
                journalctl --user -u "powercore-worker@${stage}.service" \
                  --no-pager -n 50 2>/dev/null || true
              ALL_ACTIVE=false
            fi
          done

          if [ "$ALL_ACTIVE" = "false" ]; then
            echo "ERROR: one or more PowerCore workers failed to reach 'active' state"
            exit 1
          fi
          echo "--- All PowerCore workers active ---"

      # -----------------------------------------------------------------------
      # Convert the JSON input to a CSV file and drop it into the PowerCore
      # preprocess inbox. The 03-preprocess worker picks up any file from its
      # inbox, creates a BRequest directory, and hands it to 04-shallow-scan.
      #
      # CSV column names match the ColumnMapper.COLUMN_MAPPINGS aliases in
      # 03-Preprocess/src/powercore/preprocess/preprocess.py so that the
      # preprocess stage can map them without any ambiguity.
      #
      # Required columns : package_name, package_version, technology
      # Optional columns : technology_version (defaults to lang default),
      #                    ubi_version        (blank → "ubi9" applied by preprocess)
      # -----------------------------------------------------------------------
      - name: Convert package JSON to CSV and drop into PowerCore inbox
        id: drop_csv
        run: |
          # All variables are already in the environment from the
          # "Load variable.sh into job environment" step above.
          # No JSON re-parsing needed.

          echo "--- Environment variables from variable.sh ---"
          echo "  PACKAGE_NAME       = ${PACKAGE_NAME}"
          echo "  PACKAGE_VERSION    = ${PACKAGE_VERSION}"
          echo "  TECHNOLOGY         = ${TECHNOLOGY}"
          echo "  TECHNOLOGY_VERSION = ${TECHNOLOGY_VERSION}"
          echo "  UBI_VERSION        = ${UBI_VERSION}"

          # POWERCORE_RUNTIME is resolved from systemd.env in the
          # "Create PowerCore queue directories" step and exported via $GITHUB_ENV.
          INBOX_DIR="${POWERCORE_RUNTIME}/queues/03-preprocess/inbox"

          echo "--- Verifying inbox directory exists ---"
          if ! sudo -u powercore test -d "${INBOX_DIR}"; then
            echo "ERROR: inbox directory does not exist: ${INBOX_DIR}"
            echo "--- Runtime tree (maxdepth 4) ---"
            sudo -u powercore find "${POWERCORE_RUNTIME}" -maxdepth 4 | sort || true
            exit 1
          fi
          echo "Inbox OK: ${INBOX_DIR}"

          # Filename includes package name + run ID so parallel runs don't collide
          CSV_NAME="${PACKAGE_NAME}-${{ github.run_id }}.csv"
          CSV_PATH="${INBOX_DIR}/${CSV_NAME}"

          # Write header + single data row using env vars loaded from variable.sh.
          # Using printf avoids heredoc indentation issues in YAML run blocks.
          printf '%s\n' \
            "package_name,package_version,technology,technology_version,ubi_version" \
            "${PACKAGE_NAME},${PACKAGE_VERSION},${TECHNOLOGY},${TECHNOLOGY_VERSION},${UBI_VERSION}" \
            | sudo -u powercore tee "${CSV_PATH}" > /dev/null

          echo "--- CSV written to inbox: ${CSV_PATH} ---"
          echo "Contents:"
          sudo -u powercore cat "${CSV_PATH}"

          echo "--- Inbox directory after drop ---"
          sudo -u powercore ls -lh "${INBOX_DIR}"

          # Export for the polling step
          echo "csv_name=${CSV_NAME}"                    >> $GITHUB_OUTPUT
          echo "powercore_runtime=${POWERCORE_RUNTIME}" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Track the BRequest directory as it moves through every stage.
      #
      # How the pipeline actually works (grounded in source code):
      #
      #   worker.py StageWorker._acquire_next_item():
      #     inbox/ → (atomic rename) → processing/
      #
      #   worker.py StageWorker._complete_item():
      #     processing/ → (rename) → outbox/ → (rename) → next-stage/inbox/
      #     final stage (07-bookkeeping, next_stage=None):
      #       outbox/ → (rename) → runtime/requests/
      #
      #   adapters/preprocess.py process_file():
      #     input: CSV file in queues/03-preprocess/processing/
      #     output: BRequest_* dir created in runtime/input/
      #     _complete_item then moves it → queues/04-shallow-scan/inbox/
      #     NOTE: BRequest dir does NOT exist inside 03-preprocess/queues at all —
      #           03-preprocess processes raw files, not BRequest dirs.
      #
      #   adapters/shallow_scan.py:
      #     Checks deep_scan_input.csv inside BRequest. If it has rows:
      #       → 05-deep-scan
      #     Else (all packages already satisfied):
      #       → 06-post-process  (skips deep-scan entirely)
      #
      #   Error handling (_handle_error):
      #     Writes BRequest_dir/.error with "ExceptionType: message"
      #     Then renames BRequest back to inbox/ for retry.
      #     There is NO permanent failed/ dir in the new worker.
      #     The .error file travels with the BRequest back to inbox.
      #
      # Full location space for a BRequest (from source):
      #   queues/04-shallow-scan/{inbox,processing,outbox}/BRequest_*
      #   queues/05-deep-scan/{inbox,processing,outbox}/BRequest_*    (may be skipped)
      #   queues/06-post-process/{inbox,processing,outbox}/BRequest_*
      #   queues/07-bookkeeping/{inbox,processing,outbox}/BRequest_*
      #   requests/BRequest_*   ← terminal success (worker.py:254)
      #
      # Poll every 10 s. Immediately log when location changes.
      # Soft timeout at 10500 s (175 min) to beat the 180-min GHA hard kill.
      # -----------------------------------------------------------------------
      - name: Wait for PowerCore pipeline to complete
        timeout-minutes: 180
        run: |
          POWERCORE_RUNTIME="${{ steps.drop_csv.outputs.powercore_runtime }}"
          CSV_NAME="${{ steps.drop_csv.outputs.csv_name }}"
          PKG_NAME="${PACKAGE_NAME}"

          POLL_INTERVAL=10
          ELAPSED=0
          TIMEOUT_SECS=10500
          BREQUEST=""
          PREV_LOCATION=""
          PREV_STAGE=""

          POWERCORE_UID=$(id -u powercore 2>/dev/null || echo "")
          XDG_DIR="/run/user/${POWERCORE_UID}"
          DBUS="unix:path=/run/user/${POWERCORE_UID}/bus"
          WFLOG="${POWERCORE_RUNTIME}/logs/workflow.log"

          # ── _find_brequest ───────────────────────────────────────────────────
          # Returns the BRequest path relative to POWERCORE_RUNTIME.
          # Searches: requests/ (done), then queues/ (in-flight).
          _find_brequest() {
            if sudo -u powercore test -d "${POWERCORE_RUNTIME}/requests/${BREQUEST}" 2>/dev/null; then
              echo "requests/${BREQUEST}"; return
            fi
            sudo -u powercore find "${POWERCORE_RUNTIME}/queues/" \
              -mindepth 3 -maxdepth 3 -type d -name "${BREQUEST}" 2>/dev/null \
              | head -1 | sed "s|${POWERCORE_RUNTIME}/||"
          }

          # ── _fmt_location ────────────────────────────────────────────────────
          # Converts a relative BRequest path into a human-readable label.
          _fmt_location() {
            local rel="$1"
            [[ "$rel" == requests/* ]] && { echo "DONE"; return; }
            local stage subfolder label
            stage=$(echo "$rel"     | grep -oP '\d\d-[a-z-]+' | head -1)
            subfolder=$(echo "$rel" | grep -oP '(?<=/)(inbox|processing|outbox)(?=/)' | head -1)
            case "$stage" in
              03-preprocess)   label="Stage 1/5  Pre-process"   ;;
              04-shallow-scan) label="Stage 2/5  Shallow Scan"  ;;
              05-deep-scan)    label="Stage 3/5  Deep Scan"     ;;
              06-post-process) label="Stage 4/5  Post-Process"  ;;
              07-bookkeeping)  label="Stage 5/5  Bookkeeping"   ;;
              *)               label="${stage:-${rel}}"         ;;
            esac
            case "$subfolder" in
              inbox)      label="${label}  [queued]"    ;;
              processing) label="${label}  [running]"   ;;
              outbox)     label="${label}  [done]"      ;;
            esac
            echo "${label}"
          }

          # ── _worker_journal ──────────────────────────────────────────────────
          _worker_journal() {
            local stage="$1" lines="${2:-40}"
            echo "  journal: powercore-worker@${stage} (last ${lines} lines)"
            sudo -u powercore \
              XDG_RUNTIME_DIR="${XDG_DIR}" DBUS_SESSION_BUS_ADDRESS="${DBUS}" \
              journalctl --user -u "powercore-worker@${stage}.service" \
                --no-pager -n "${lines}" 2>/dev/null || true
          }

          _dump_all_journals() {
            echo "========== Worker journals =========="
            for s in 03-preprocess 04-shallow-scan 05-deep-scan 06-post-process 07-bookkeeping; do
              _worker_journal "$s"
            done
          }

          # ── _section_header ──────────────────────────────────────────────────
          # Print a bold section banner whenever we enter a new pipeline stage.
          _section_header() {
            local stage="$1" elapsed_min="$2" elapsed_sec="$3"
            echo ""
            echo "============================================================"
            case "$stage" in
              04-shallow-scan) echo "  Stage 2/5 — Shallow Scan  [${elapsed_min}m${elapsed_sec}s]" ;;
              05-deep-scan)    echo "  Stage 3/5 — Deep Scan     [${elapsed_min}m${elapsed_sec}s]" ;;
              06-post-process) echo "  Stage 4/5 — Post-Process  [${elapsed_min}m${elapsed_sec}s]" ;;
              07-bookkeeping)  echo "  Stage 5/5 — Bookkeeping   [${elapsed_min}m${elapsed_sec}s]" ;;
            esac
            echo "============================================================"
          }

          # ── _print_shallow_summary ───────────────────────────────────────────
          # Reads shallow_scan_metadata.json (written by shallow_scan.py:300-354)
          # and prints the categorisation counts + reduction %.
          # Fields: statistics.{satisfied,failed_known,noarch_unverified,rebuild,
          #           new,lang_ver_unavailable,pass_to_deep_scan,reduction_pct}
          #         duration_seconds
          _print_shallow_summary() {
            local brequest_dir="$1"
            local meta
            meta=$(sudo -u powercore find "${brequest_dir}" \
              -name "shallow_scan_metadata.json" 2>/dev/null | head -1)
            [ -z "$meta" ] && return
            local _py; _py=$(mktemp /tmp/pc_ss_XXXXXX.py)
            echo  \
              | base64 -d > "${_py}"
            sudo -u powercore python3 "${_py}" "${meta}" 2>/dev/null || true
            rm -f "${_py}"
          }

          # ── _print_deep_scan_summary ─────────────────────────────────────────
          # Reads the batch-mode final line from workflow.log written by
          # progress_reporter.py final_summary() (non-interactive path):
          #   "■ DONE  N/T ✓  F ✗  elapsed=Xm Ys  success=Z%"
          # Falls back to run_core.py log lines:
          #   "Successful: N" / "Failed: N" / "Success rate: X%"
          _print_deep_scan_summary() {
            [ ! -f "${WFLOG}" ] && return
            local done_line
            done_line=$(sudo -u powercore grep -a "DONE" "${WFLOG}" 2>/dev/null \
              | grep -a "elapsed=" | tail -1)
            if [ -n "$done_line" ]; then
              echo "  Deep Scan Summary"
              echo "  ----------------------------------------"
              echo "  ${done_line}"
              echo "  ----------------------------------------"
            else
              # Fallback: parse individual log lines from run_core._print_summary()
              local total success failed rate
              total=$(sudo -u powercore grep -a "Total packages:" "${WFLOG}" 2>/dev/null | tail -1 | grep -oP '\d+')
              success=$(sudo -u powercore grep -a "Successful:" "${WFLOG}" 2>/dev/null | tail -1 | grep -oP '\d+')
              failed=$(sudo -u powercore grep -a "^.*Failed: \d" "${WFLOG}" 2>/dev/null | tail -1 | grep -oP '\d+$')
              rate=$(sudo -u powercore grep -a "Success rate:" "${WFLOG}" 2>/dev/null | tail -1 | grep -oP '[\d.]+%')
              if [ -n "$total" ]; then
                echo "  Deep Scan Summary"
                echo "  ----------------------------------------"
                echo "  Total     : ${total}"
                echo "  Succeeded : ${success:-?}"
                echo "  Failed    : ${failed:-?}"
                echo "  Rate      : ${rate:-?}"
                echo "  ----------------------------------------"
              fi
            fi
          }

          # ── _print_postprocess_summary ───────────────────────────────────────
          # Reads post_process_summary.json (models.py totals keys):
          #   total_packages, build_success, build_success_unverified,
          #   install_fail, build_fail, test_fail, timeout, partial
          _print_postprocess_summary() {
            local pp="$1/post_process_summary.json"
            sudo -u powercore test -f "${pp}" 2>/dev/null || return
            local _py; _py=$(mktemp /tmp/pc_pp_XXXXXX.py)
            echo  \
              | base64 -d > "${_py}"
            sudo -u powercore python3 "${_py}" "${pp}" 2>/dev/null || true
            rm -f "${_py}"
          }

          # ── _print_shallow_csv ───────────────────────────────────────────────
          _print_shallow_csv() {
            local csv_path="$1"
            [ -z "$csv_path" ] && return
            local _py; _py=$(mktemp /tmp/pc_scsv_XXXXXX.py)
            echo  \
              | base64 -d > "${_py}"
            sudo -u powercore python3 "${_py}" "${csv_path}" 2>/dev/null || true
            rm -f "${_py}"
          }

          # ════════════════════════════════════════════════════════════════════
          # STARTUP BANNER
          # ════════════════════════════════════════════════════════════════════
          echo "============================================================"
          echo "  PowerCore Pipeline Monitor"
          echo "============================================================"
          echo "  Package      : ${PKG_NAME}"
          echo "  CSV file     : ${CSV_NAME}"
          echo "  Runtime      : ${POWERCORE_RUNTIME}"
          echo "  Poll interval: ${POLL_INTERVAL}s  |  Soft timeout: $((TIMEOUT_SECS/60))min"
          echo "============================================================"
          echo ""

          # ════════════════════════════════════════════════════════════════════
          # STAGE 1/5 — PRE-PROCESS
          # Wait for 03-preprocess to consume the CSV and create a BRequest dir.
          # BRequest name = BRequest_{date}_{csv_stem}_{uuid8}  (generate_task_id)
          # BRequest created in runtime/input/ or runtime/ root (config-dependent).
          # ════════════════════════════════════════════════════════════════════
          CSV_STEM="${CSV_NAME%.csv}"
          CSV_STEM_SAFE=$(echo "${CSV_STEM}" | tr -c 'a-zA-Z0-9_-' '_')

          echo "------------------------------------------------------------"
          echo "  Stage 1/5  Pre-process  [waiting for BRequest creation]"
          echo "------------------------------------------------------------"

          while [ -z "$BREQUEST" ]; do
            if [ "${ELAPSED}" -ge "${TIMEOUT_SECS}" ]; then
              echo "TIMEOUT (${ELAPSED}s) — Pre-process never created a BRequest"
              echo "  03-preprocess/inbox:"
              sudo -u powercore ls -lh "${POWERCORE_RUNTIME}/queues/03-preprocess/inbox/" 2>/dev/null || true
              echo "  03-preprocess/processing:"
              sudo -u powercore ls -lh "${POWERCORE_RUNTIME}/queues/03-preprocess/processing/" 2>/dev/null || true
              echo "  runtime/input/:"
              sudo -u powercore ls -lh "${POWERCORE_RUNTIME}/input/" 2>/dev/null || true
              _worker_journal "03-preprocess"
              exit 1
            fi

            FOUND=$(
              {
                sudo -u powercore find "${POWERCORE_RUNTIME}/input/" \
                  -maxdepth 1 -type d -name "BRequest_*" 2>/dev/null
                sudo -u powercore find "${POWERCORE_RUNTIME}" \
                  -maxdepth 1 -type d -name "BRequest_*" 2>/dev/null
                sudo -u powercore find "${POWERCORE_RUNTIME}/queues/" \
                  -mindepth 3 -maxdepth 3 -type d -name "BRequest_*" 2>/dev/null
              } | head -1
            )

            if [ -n "$FOUND" ]; then
              BREQUEST=$(basename "$FOUND")
              REL=$(echo "$FOUND" | sed "s|${POWERCORE_RUNTIME}/||")
              PREV_LOCATION="$REL"
              ELAPSED_MIN=$(( ELAPSED / 60 ))
              ELAPSED_SEC=$(( ELAPSED % 60 ))
              echo ""
              echo "  BRequest created: ${BREQUEST}  [${ELAPSED_MIN}m${ELAPSED_SEC}s]"
              echo "  Starting location: $(_fmt_location "${REL}")"
              echo ""

              # Print preprocess log lines from workflow.log
              if sudo -u powercore test -f "${WFLOG}" 2>/dev/null; then
                echo "  Pre-process log (last 10 lines):"
                sudo -u powercore grep -a "03-preprocess\|preprocess\|BRequest" "${WFLOG}" 2>/dev/null \
                  | tail -10 | sed 's/^/    /' || true
                echo ""
              fi
              break
            fi

            if [ "$(( ELAPSED % 60 ))" -eq 0 ] && [ "${ELAPSED}" -gt 0 ]; then
              CSV_IN_INBOX="NO"; CSV_IN_PROC="NO"
              sudo -u powercore test -f \
                "${POWERCORE_RUNTIME}/queues/03-preprocess/inbox/${CSV_NAME}" \
                2>/dev/null && CSV_IN_INBOX="YES"
              sudo -u powercore test -f \
                "${POWERCORE_RUNTIME}/queues/03-preprocess/processing/${CSV_NAME}" \
                2>/dev/null && CSV_IN_PROC="YES"
              ELAPSED_MIN=$(( ELAPSED / 60 ))
              echo "  [${ELAPSED_MIN}m] Waiting... CSV in inbox=${CSV_IN_INBOX} processing=${CSV_IN_PROC}"
              _worker_journal "03-preprocess" 10
            else
              echo "  [${ELAPSED}s] Waiting for Pre-process to create BRequest..."
            fi
            sleep "${POLL_INTERVAL}"
            ELAPSED=$(( ELAPSED + POLL_INTERVAL ))
          done

          # ════════════════════════════════════════════════════════════════════
          # STAGE 2–5: Track BRequest through the remaining pipeline stages
          # ════════════════════════════════════════════════════════════════════
          while true; do
            if [ "${ELAPSED}" -ge "${TIMEOUT_SECS}" ]; then
              echo ""
              echo "TIMEOUT (${ELAPSED}s) — pipeline did not complete in time"
              _dump_all_journals
              exit 1
            fi

            # ── SUCCESS ──────────────────────────────────────────────────────
            if sudo -u powercore test -d "${POWERCORE_RUNTIME}/requests/${BREQUEST}" 2>/dev/null; then
              RESULT_DIR="${POWERCORE_RUNTIME}/requests/${BREQUEST}"
              ELAPSED_MIN=$(( ELAPSED / 60 ))
              ELAPSED_SEC=$(( ELAPSED % 60 ))

              echo ""
              echo "============================================================"
              echo "  PIPELINE COMPLETE  [${ELAPSED_MIN}m${ELAPSED_SEC}s total]"
              echo "============================================================"
              echo "  Package   : ${PKG_NAME}"
              echo "  BRequest  : ${BREQUEST}"
              echo "  Result    : ${RESULT_DIR}"
              echo ""

              # ── Post-process summary ────────────────────────────────────
              _print_postprocess_summary "${RESULT_DIR}"
              echo ""

              # ── Shallow scan per-package status ─────────────────────────
              SHALLOW_CSV=$(sudo -u powercore find "${RESULT_DIR}" \
                -maxdepth 1 -name "*shallow_results.csv" 2>/dev/null | head -1)
              if [ -n "$SHALLOW_CSV" ]; then
                echo "  Shallow Scan — Per-Package Status"
                echo "  ----------------------------------------"
                _print_shallow_csv "${SHALLOW_CSV}"
                echo ""
              fi

              # ── Output files ─────────────────────────────────────────────
              OUTPUT_DIR="${RESULT_DIR}/output"
              if sudo -u powercore test -d "${OUTPUT_DIR}" 2>/dev/null; then
                echo "  Output Files"
                echo "  ----------------------------------------"
                sudo -u powercore find "${OUTPUT_DIR}" -type f | sort | while read -r f; do
                  SIZE=$(sudo -u powercore du -sh "$f" 2>/dev/null | cut -f1)
                  printf "  %-8s  %s\n" "${SIZE}" "${f#${RESULT_DIR}/}"
                done
                echo ""
              fi

              echo "============================================================"
              exit 0
            fi

            # ── ERROR ────────────────────────────────────────────────────────
            ERROR_FILE=$(sudo -u powercore find "${POWERCORE_RUNTIME}/queues/" \
              -name ".error" 2>/dev/null | grep "/${BREQUEST}/" | head -1)
            if [ -n "$ERROR_FILE" ]; then
              echo ""
              echo "  ERROR detected in ${BREQUEST}"
              echo "  .error: ${ERROR_FILE}"
              sudo -u powercore cat "${ERROR_FILE}" | sed 's/^/  /'
              CUR_LOC=$(_find_brequest)
              ERR_STAGE=$(echo "$CUR_LOC" | grep -oP '\d\d-[a-z-]+' | head -1)
              [ -n "$ERR_STAGE" ] && _worker_journal "${ERR_STAGE}" 30
              echo "  (worker will retry — waiting for recovery or timeout)"
            fi

            # ── LOCATE ───────────────────────────────────────────────────────
            CUR_LOCATION=$(_find_brequest)
            if [ -z "$CUR_LOCATION" ]; then
              sleep 2; ELAPSED=$(( ELAPSED + 2 )); continue
            fi

            # ── TRANSITION ───────────────────────────────────────────────────
            if [ "${CUR_LOCATION}" != "${PREV_LOCATION}" ]; then
              CUR_STAGE=$(echo "$CUR_LOCATION" | grep -oP '\d\d-[a-z-]+' | head -1)
              CUR_SUB=$(echo "$CUR_LOCATION"   | grep -oP '(?<=/)(inbox|processing|outbox)(?=/)' | head -1)
              ELAPSED_MIN=$(( ELAPSED / 60 ))
              ELAPSED_SEC=$(( ELAPSED % 60 ))

              # Print section header when entering a new stage for the first time
              if [ "${CUR_STAGE}" != "${PREV_STAGE}" ] && [ -n "${CUR_STAGE}" ]; then
                _section_header "${CUR_STAGE}" "${ELAPSED_MIN}" "${ELAPSED_SEC}"

                # Print per-stage summary when leaving a stage
                case "${PREV_STAGE}" in
                  04-shallow-scan)
                    # BRequest just moved out of shallow-scan → print shallow summary
                    PREV_BREQ_DIR="${POWERCORE_RUNTIME}/queues/${PREV_STAGE}/outbox/${BREQUEST}"
                    # may already be gone; search all subfolders of the stage
                    BREQ_SEARCH=$(sudo -u powercore find \
                      "${POWERCORE_RUNTIME}/queues/${PREV_STAGE}" \
                      -name "shallow_scan_metadata.json" 2>/dev/null | head -1)
                    if [ -n "$BREQ_SEARCH" ]; then
                      _print_shallow_summary "$(dirname "$BREQ_SEARCH")"
                    else
                      # Check if it's already in the current stage dir
                      _print_shallow_summary \
                        "${POWERCORE_RUNTIME}/queues/${CUR_STAGE}/${CUR_SUB:-inbox}/${BREQUEST}"
                    fi
                    echo ""
                    ;;
                  05-deep-scan)
                    _print_deep_scan_summary
                    echo ""
                    ;;
                esac

                PREV_STAGE="${CUR_STAGE}"
              fi

              echo "  [${ELAPSED_MIN}m${ELAPSED_SEC}s]  $(_fmt_location "${CUR_LOCATION}")"
              PREV_LOCATION="${CUR_LOCATION}"
            else
              # Heartbeat every 60 s
              if [ "$(( ELAPSED % 60 ))" -eq 0 ] && [ "${ELAPSED}" -gt 0 ]; then
                ELAPSED_MIN=$(( ELAPSED / 60 ))
                echo "  ... [${ELAPSED_MIN}m]  $(_fmt_location "${CUR_LOCATION}")"
              fi
            fi

            sleep "${POLL_INTERVAL}"
            ELAPSED=$(( ELAPSED + POLL_INTERVAL ))
          done
